<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mon profil')}"></head>

<body>
<svg th:replace="~{fragments/layout :: icons}"></svg>
<header th:replace="~{fragments/layout :: header('profil')}"></header>

<main class="container page">
    <div class="narrow stack">
        <th:block th:replace="~{fragments/layout :: flash}"></th:block>

        <h1 class="title">Mon profil</h1>

        <section class="card-night stack-sm" aria-label="Avancement du profil">
            <div class="row-between small" style="font-weight: 700">
                <span>Profil complété</span>
                <strong th:text="${completion} + ' %'">60 %</strong>
            </div>
            <div class="progress" aria-hidden="true"><span th:style="'width: ' + ${completion} + '%'"></span></div>
            <p class="hand-m" style="font-size: 24px"
               th:text="${completion >= 100} ? 'Parfait, l\'IA a tout ce qu\'il lui faut !' : 'Plus il est complet, plus vos lettres sont justes.'">
                Plus il est complet, plus vos lettres sont justes.</p>
        </section>

        <form th:action="@{/profil}" th:object="${profil}" method="post" novalidate class="stack">

            <section class="card stack">
                <h2 class="hand-m verb-trouver">Ce que je cherche</h2>
                <div class="field">
                    <label for="metierVise">Métier visé</label>
                    <input type="text" th:field="*{metierVise}" class="input" th:errorclass="is-invalid"
                           placeholder="Ex : formateur pour adultes, aide-soignant, comptable">
                    <span class="error" th:if="${#fields.hasErrors('metierVise')}" th:errors="*{metierVise}"></span>
                </div>
                <div class="field">
                    <label for="motsCles">Type d'entreprises à chercher</label>
                    <input type="text" th:field="*{motsCles}" class="input" th:errorclass="is-invalid"
                           placeholder="Ex : organisme de formation, maison de retraite">
                    <span class="help">Ces mots servent à chercher les entreprises dans l'annuaire officiel.</span>
                    <span class="error" th:if="${#fields.hasErrors('motsCles')}" th:errors="*{motsCles}"></span>
                </div>
                <div class="field">
                    <label for="departements">Départements</label>
                    <input type="text" th:field="*{departements}" class="input" th:errorclass="is-invalid" placeholder="Ex : 78, 92">
                    <span class="help">Numéros séparés par des virgules.</span>
                    <span class="error" th:if="${#fields.hasErrors('departements')}" th:errors="*{departements}"></span>
                </div>
            </section>

            <section class="card stack">
                <h2 class="hand-m verb-ecrire">Mon parcours</h2>
                <div class="field">
                    <label for="cvResume">Résumé de mon CV</label>
                    <textarea th:field="*{cvResume}" class="textarea" rows="6" th:errorclass="is-invalid"
                              placeholder="Vos expériences, diplômes et formations, en quelques lignes."></textarea>
                    <span class="error" th:if="${#fields.hasErrors('cvResume')}" th:errors="*{cvResume}"></span>
                </div>
                <div class="field">
                    <label for="pointsForts">Mes points forts</label>
                    <textarea th:field="*{pointsForts}" class="textarea" rows="3" th:errorclass="is-invalid"
                              placeholder="Ex : patient, bilingue français-arabe, permis B"></textarea>
                    <span class="error" th:if="${#fields.hasErrors('pointsForts')}" th:errors="*{pointsForts}"></span>
                </div>
            </section>

            <section class="card stack">
                <h2 class="hand-m verb-relancer">Ma signature</h2>
                <p class="small muted" style="margin: 0">Ajoutés sous vos lettres, après votre prénom et votre nom.</p>
                <div class="form-grid">
                    <div class="field">
                        <label for="telephone">Téléphone</label>
                        <input type="tel" th:field="*{telephone}" class="input" th:errorclass="is-invalid" autocomplete="tel">
                        <span class="error" th:if="${#fields.hasErrors('telephone')}" th:errors="*{telephone}"></span>
                    </div>
                    <div class="field">
                        <label for="lienProfil">Lien LinkedIn ou portfolio</label>
                        <input type="url" th:field="*{lienProfil}" class="input" th:errorclass="is-invalid" placeholder="https://">
                        <span class="error" th:if="${#fields.hasErrors('lienProfil')}" th:errors="*{lienProfil}"></span>
                    </div>
                </div>
            </section>

            <button type="submit" class="btn btn-primary btn-lg btn-block">Enregistrer mon profil</button>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<nav th:replace="~{fragments/layout :: tabbar('profil')}"></nav>
</body>
</html>
