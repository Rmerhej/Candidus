<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mes candidatures')}"></head>

<body>
<svg th:replace="~{fragments/layout :: icons}"></svg>
<header th:replace="~{fragments/layout :: header('candidatures')}"></header>

<main class="container page">
    <th:block th:replace="~{fragments/layout :: flash}"></th:block>

    <div class="row-between" style="flex-wrap: nowrap">
        <h1 class="title">Mes candidatures</h1>
        <a th:href="@{/candidatures/nouvelle}" class="btn btn-primary" aria-label="Ajouter une candidature">
            <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg> <span class="hide-mobile">Ajouter</span>
        </a>
    </div>

    <!-- Recherche -->
    <form th:action="@{/candidatures}" method="get" class="search-row" role="search">
        <input type="hidden" name="statut" th:if="${statut != null}" th:value="${statut}">
        <label for="q" class="sr-only">Rechercher</label>
        <input type="search" id="q" name="q" th:value="${q}" class="input" placeholder="Entreprise, poste ou ville">
        <button type="submit" class="btn btn-secondary" aria-label="Rechercher">
            <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg> <span class="hide-mobile">Rechercher</span>
        </button>
    </form>

    <!-- Filtres par statut -->
    <nav class="chips" aria-label="Filtrer par statut">
        <a th:href="@{/candidatures(q=${q})}" class="chip" th:aria-current="${statut == null} ? 'true'">Toutes</a>
        <a th:each="s : ${statuts}" th:href="@{/candidatures(statut=${s},q=${q})}" class="chip"
           th:aria-current="${s == statut} ? 'true'" th:text="${s.libelle}">Statut</a>
    </nav>

    <!-- Aucune candidature -->
    <div th:if="${candidatures.empty}" class="card-chalk stack" style="align-items: center; text-align: center; padding: 40px 20px">
        <p class="hand-m verb-trouver" th:text="${hasFilters} ? 'Rien par ici…' : 'Tout commence ici !'">Tout commence ici !</p>
        <p class="muted" style="margin: 0" th:text="${hasFilters} ? 'Aucune candidature ne correspond à ces filtres.'
                                                   : 'Vous n\'avez pas encore de candidature.'">Aucune candidature.</p>
        <a th:unless="${hasFilters}" th:href="@{/entreprises}" class="btn btn-primary">
            <svg class="icon" aria-hidden="true"><use href="#i-pin"></use></svg> Trouver des entreprises
        </a>
    </div>

    <!-- Liste -->
    <ul th:unless="${candidatures.empty}" class="item-list">
        <li th:each="c : ${candidatures.content}">
            <a th:href="@{/candidatures/{id}(id=${c.id})}" class="item"
               th:classappend="${c.statut.name() == 'A_ENVOYER'} ? 'todo'">
                <span class="item-main">
                    <span class="avatar" th:classappend="'avatar-' + ${c.teinte}" aria-hidden="true" th:text="${c.initiale}">F</span>
                    <span style="min-width: 0">
                        <span class="item-title" th:text="${c.entreprise}">Entreprise</span>
                        <span class="item-sub">
                            <th:block th:if="${c.poste}" th:text="${c.poste}">Poste</th:block><th:block
                                th:if="${c.poste != null and c.ville != null}"> · </th:block><th:block
                                th:if="${c.ville}" th:text="${c.ville}">Ville</th:block>
                        </span>
                        <span th:if="${c.relanceDue}" class="item-alert">Relance à faire</span>
                    </span>
                </span>
                <span class="item-side">
                    <span class="badge" th:classappend="'badge-' + ${c.statut.couleur}" th:text="${c.statut.libelle}">Statut</span>
                    <span th:if="${c.aiAdequation != null}" class="match" th:text="${c.aiAdequation} + ' % pour vous'">82 % pour vous</span>
                </span>
            </a>
        </li>
    </ul>

    <!-- Pagination -->
    <nav th:if="${totalPages > 1}" class="pager" aria-label="Pages">
        <a class="btn btn-secondary" th:classappend="${currentPage == 0} ? 'disabled'"
           th:href="@{/candidatures(page=${currentPage - 1},size=${pageSize},statut=${statut},q=${q})}">Précédent</a>
        <span class="small muted" th:text="${currentPage + 1} + ' / ' + ${totalPages}">1 / 1</span>
        <a class="btn btn-secondary" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'"
           th:href="@{/candidatures(page=${currentPage + 1},size=${pageSize},statut=${statut},q=${q})}">Suivant</a>
    </nav>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<nav th:replace="~{fragments/layout :: tabbar('candidatures')}"></nav>
</body>
</html>
