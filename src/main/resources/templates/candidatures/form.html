<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Candidature')}"></head>

<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <h1 class="h3 mb-4"
                th:text="${candidature.id == null} ? 'Nouvelle candidature' : 'Modifier la candidature'">Candidature</h1>

            <form th:action="@{/candidatures}" th:object="${candidature}" method="post" novalidate
                  class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <input type="hidden" th:field="*{id}">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="entreprise" class="form-label">Entreprise *</label>
                            <input type="text" th:field="*{entreprise}" class="form-control"
                                   th:classappend="${#fields.hasErrors('entreprise')} ? 'is-invalid'" required>
                            <div class="invalid-feedback" th:errors="*{entreprise}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="poste" class="form-label">Poste visé</label>
                            <input type="text" th:field="*{poste}" class="form-control"
                                   th:classappend="${#fields.hasErrors('poste')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{poste}"></div>
                        </div>
                        <div class="col-12">
                            <label for="offreUrl" class="form-label">Lien de l'offre (si elle existe)</label>
                            <input type="url" th:field="*{offreUrl}" class="form-control" placeholder="https://"
                                   th:classappend="${#fields.hasErrors('offreUrl')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{offreUrl}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="siteWeb" class="form-label">Site de l'entreprise</label>
                            <input type="url" th:field="*{siteWeb}" class="form-control" placeholder="https://"
                                   th:classappend="${#fields.hasErrors('siteWeb')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{siteWeb}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="ville" class="form-label">Ville</label>
                            <input type="text" th:field="*{ville}" class="form-control"
                                   th:classappend="${#fields.hasErrors('ville')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{ville}"></div>
                        </div>
                        <div class="col-md-2">
                            <label for="codePostal" class="form-label">Code postal</label>
                            <input type="text" th:field="*{codePostal}" class="form-control" inputmode="numeric"
                                   th:classappend="${#fields.hasErrors('codePostal')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{codePostal}"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="statut" class="form-label">Statut</label>
                            <select th:field="*{statut}" class="form-select"
                                    th:classappend="${#fields.hasErrors('statut')} ? 'is-invalid'">
                                <option th:each="s : ${statuts}" th:value="${s}" th:text="${s.libelle}">Statut</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{statut}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="dateEnvoi" class="form-label">Date d'envoi</label>
                            <input type="date" th:field="*{dateEnvoi}" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label for="dateRelance" class="form-label">Date de relance</label>
                            <input type="date" th:field="*{dateRelance}" class="form-control">
                            <div class="form-text">Calculée automatiquement si vous la laissez vide.</div>
                        </div>

                        <div class="col-12">
                            <label for="notes" class="form-label">Notes</label>
                            <textarea th:field="*{notes}" class="form-control" rows="4"
                                      th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid'"
                                      placeholder="Nom du contact, éléments de l'annonce, ce qui vous plaît dans l'entreprise…"></textarea>
                            <div class="invalid-feedback" th:errors="*{notes}"></div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Enregistrer</button>
                        <a th:href="${candidature.id == null} ? @{/candidatures} : @{/candidatures/{id}(id=${candidature.id})}"
                           class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
