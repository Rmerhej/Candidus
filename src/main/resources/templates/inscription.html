<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Créer mon compte')}"></head>

<body>
<svg th:replace="~{fragments/layout :: icons}"></svg>

<main class="auth">
    <div class="auth-box" style="max-width: 560px">
        <div class="row-between">
            <a th:replace="~{fragments/layout :: logo(@{/})}"></a>
            <button th:replace="~{fragments/layout :: themeToggle}"></button>
        </div>

        <div>
            <p class="hand-xl">Bienvenue !</p>
            <h1 class="title">Créer mon compte</h1>
        </div>

        <form th:action="@{/inscription}" th:object="${form}" method="post" novalidate class="stack">
            <div class="form-grid">
                <div class="field">
                    <label for="prenom">Prénom</label>
                    <input type="text" th:field="*{prenom}" class="input" th:errorclass="is-invalid" autocomplete="given-name" required>
                    <span class="error" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></span>
                </div>
                <div class="field">
                    <label for="nom">Nom</label>
                    <input type="text" th:field="*{nom}" class="input" th:errorclass="is-invalid" autocomplete="family-name" required>
                    <span class="error" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></span>
                </div>
                <div class="field full">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" th:field="*{email}" class="input" th:errorclass="is-invalid" autocomplete="email" required>
                    <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>
                <div class="field">
                    <label for="motDePasse">Mot de passe</label>
                    <input type="password" th:field="*{motDePasse}" class="input" th:errorclass="is-invalid" autocomplete="new-password" required>
                    <span class="help">10 caractères minimum.</span>
                    <span class="error" th:if="${#fields.hasErrors('motDePasse')}" th:errors="*{motDePasse}"></span>
                </div>
                <div class="field">
                    <label for="confirmation">Confirmation</label>
                    <input type="password" th:field="*{confirmation}" class="input"
                           th:classappend="${#fields.hasErrors('confirmation') or #fields.hasErrors('confirmationIdentique')} ? 'is-invalid'"
                           autocomplete="new-password" required>
                    <span class="error" th:if="${#fields.hasErrors('confirmation')}" th:errors="*{confirmation}"></span>
                    <span class="error" th:if="${#fields.hasErrors('confirmationIdentique')}" th:errors="*{confirmationIdentique}"></span>
                </div>
            </div>

            <div class="field">
                <div class="check">
                    <input type="checkbox" th:field="*{accepteConditions}">
                    <label th:for="${#ids.prev('accepteConditions')}" style="font-weight: 600">
                        J'accepte les <a th:href="@{/conditions}" target="_blank">conditions d'utilisation</a>
                        et la <a th:href="@{/confidentialite}" target="_blank">politique de confidentialité</a>.
                    </label>
                </div>
                <span class="error" th:if="${#fields.hasErrors('accepteConditions')}" th:errors="*{accepteConditions}"></span>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block">Créer mon compte</button>
        </form>

        <p class="muted" style="margin: 0; text-align: center">
            Déjà inscrit ? <a th:href="@{/login}">Se connecter</a>
        </p>
    </div>
</main>
</body>
</html>
