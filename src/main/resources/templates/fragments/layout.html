<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<!-- En-tête commun : th:replace="~{fragments/layout :: head('Titre')}" -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1d4ed8">
    <title th:text="${title} + ' - Candidus'">Candidus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link th:href="@{/css/candidus.css}" rel="stylesheet">
</head>

<body>

<!-- Barre de navigation des pages connectées : th:replace="~{fragments/layout :: navbar}" -->
<nav th:fragment="navbar" class="navbar navbar-expand-md navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/tableau-de-bord}">
            <i class="bi bi-briefcase"></i> Candidus
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Ouvrir le menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto align-items-md-center gap-md-2">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/tableau-de-bord}"><i class="bi bi-house"></i> Accueil</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/candidatures}"><i class="bi bi-list-check"></i> Mes candidatures</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/entreprises}"><i class="bi bi-building"></i> Trouver des entreprises</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/profil}"><i class="bi bi-person"></i> Mon profil</a>
                </li>
                <li class="nav-item">
                    <!-- Déconnexion en POST (avec jeton CSRF) : un simple lien ne suffit pas -->
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-light" title="Se déconnecter">
                            <i class="bi bi-box-arrow-right"></i> <span class="d-md-none">Se déconnecter</span>
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Messages de succès et d'erreur : th:replace="~{fragments/layout :: flash}" -->
<th:block th:fragment="flash">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
    </div>
</th:block>

<!-- Pied de page commun -->
<footer th:fragment="footer" class="text-center text-secondary small py-4">
    Candidus – l'assistant emploi français. Rien n'est envoyé sans votre accord.
</footer>

<!-- Scripts communs : th:replace="~{fragments/layout :: scripts}" -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</th:block>

</body>
</html>
